build:
  maxIssues: -1
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  DoubleMutabilityForCollection:
    active: true
  CastToNullableType:
    active: true

style:
  active: true
  WildcardImport:
    active: true
  VarCouldBeVal:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryApply:
    active: true
  ForbiddenComment:
    active: false

naming:
  active: true
  PackageNaming:
    active: true
  ClassNaming:
    active: true

formatting:
  active: false
