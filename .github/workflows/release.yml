name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleFlossOsmRelease

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/flossOsm/release/
          VERSION=${{ github.ref_name }}
          # Ensure version starts with 'v' if it doesn't already
          if [[ $VERSION != v* ]]; then
            VERSION="v$VERSION"
          fi
          # Rename the file
          mv app-floss-osm-release.apk "cashledger-${VERSION}.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/flossOsm/release/cashledger-*.apk
