name: build

on:
  push:
    branches: [master, userinterface]
  pull_request:

permissions:
  contents: read

# Cancel obsolete in-progress builds when a new commit is pushed to the same branch or PR
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Robolectric fetches the android-all jar for the SDK it runs against, about
      # 190 MB, into the Maven local repository and not the Gradle cache, so the
      # step above does not keep it. Which jar that is follows the Robolectric
      # version, now in gradle/libs.versions.toml, and targetSdk, still in
      # app/build.gradle, so the key follows both files. A cache entry is never
      # rewritten on an exact hit, which is why the key cannot be a constant. A
      # bump would keep restoring the old jar and fetching the new one on every
      # run. No restore-keys on purpose, since a restored entry is saved back as
      # a union and nothing prunes a superseded jar, so an entry would grow by a
      # jar per bump. An unrelated edit to either file costs one fetch instead.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle', 'gradle/libs.versions.toml') }}

      - name: Build, Test, and Lint
        run: |
          chmod +x gradlew
          ./gradlew testFlossOsmDebugUnitTest lintFlossOsmDebug assembleFlossOsmDebug --continue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-flossOsmDebug.html

      # The unit tests run before lint, so a failing test is the most common red
      # run and the one with no lint report to upload. Keep its own report.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testFlossOsmDebugUnitTest/**
            app/build/test-results/testFlossOsmDebugUnitTest/**

      - name: Prepare debug APK
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          mkdir -p staging/debug
          for apk in app/build/outputs/apk/flossOsm/debug/*.apk; do
            cp "$apk" "staging/debug/cashledger-build#${COMMIT_ID}-dev.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: staging
