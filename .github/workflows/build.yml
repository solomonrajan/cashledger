name: build

on:
  push:
    branches: [master, userinterface, kotlin, v3.0.0, Category_Split]
    paths-ignore:
      - "**.md"
      - "**.mdx"
      - "docs/**"
      - "pictures/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.mdx"
      - "docs/**"
      - "pictures/**"
      - ".gitignore"

permissions:
  contents: write

# Cancel obsolete in-progress builds when a new commit is pushed to the same branch or PR
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Robolectric fetches the android-all jar for the SDK it runs against into
      # the Maven local repository (~/.m2/repository). Restore-keys ensures that
      # branch builds can reuse caches from master or prior runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-

      # Pre-warm the Robolectric SDK jars in the local Maven cache with retries
      # to prevent runtime parallel download failures or rate-limiting on cold cache runs.
      - name: Pre-fetch Robolectric SDK dependencies
        run: |
          ROBO_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented"
          VERSIONS=(
            "12.1-robolectric-8229987-i7"
            "13-robolectric-9030017-i7"
            "15-robolectric-13954326-i7"
          )
          BASE_URL="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented"

          for ver in "${VERSIONS[@]}"; do
            dir="$ROBO_DIR/$ver"
            mkdir -p "$dir"
            for ext in ".pom" ".pom.sha512" ".jar" ".jar.sha512"; do
              file="android-all-instrumented-$ver$ext"
              if [ ! -s "$dir/$file" ]; then
                echo "Pre-fetching $file..."
                curl -sSL --retry 5 --retry-connrefused -A "Mozilla/5.0" \
                  "$BASE_URL/$ver/$file" -o "$dir/$file"
              fi
            done
          done

      - name: Build, Test, and Lint
        run: |
          chmod +x gradlew
          ./gradlew testFlossOsmDebugUnitTest lintFlossOsmDebug assembleFlossOsmDebug --continue

      - name: Run Detekt Static Analysis
        run: ./gradlew detekt --continue
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-flossOsmDebug.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt/

      # The unit tests run before lint, so a failing test is the most common red
      # run and the one with no lint report to upload. Keep its own report.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testFlossOsmDebugUnitTest/**
            app/build/test-results/testFlossOsmDebugUnitTest/**

      - name: Prepare debug APK
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          mkdir -p staging/debug
          for apk in app/build/outputs/apk/flossOsm/debug/*.apk; do
            cp "$apk" "staging/debug/cashledger-build#${COMMIT_ID}-dev.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: staging

      - name: Prepare Dev Release
        if: github.event_name == 'push'
        run: |
          git fetch --tags --force
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'=' '{print $2}' | tr -d ' "' | tr -d "'")
          LATEST_TAG="v${VERSION_NAME:-1.0.0}"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -ra ADDR <<< "$VERSION"
          MAJOR=${ADDR[0]:-1}
          MINOR=${ADDR[1]:-0}
          PATCH=${ADDR[2]:-0}
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          COMMITS_SINCE_TAG=$(git rev-list ${LATEST_TAG}..HEAD --count 2>/dev/null || echo "1")
          if [ -z "$COMMITS_SINCE_TAG" ] || [ "$COMMITS_SINCE_TAG" -eq 0 ]; then
            COMMITS_SINCE_TAG=1
          fi

          # Zero-pad the commit count to ensure correct alphabetical sorting on GitHub
          COMMITS_PADDED=$(printf "%04d" $COMMITS_SINCE_TAG)

          TAG_NAME="${NEXT_VERSION}-dev.${COMMITS_PADDED}"
          DATE=$(date +'%Y-%m-%d')

          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          echo "## Commit Details" > release_notes.md
          echo "* ${COMMIT_MSG} ([${COMMIT_HASH}](${COMMIT_URL}))" >> release_notes.md

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Create Dev Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }} (${{ env.DATE }})
          body_path: release_notes.md
          prerelease: true
          files: staging/debug/cashledger-*.apk
